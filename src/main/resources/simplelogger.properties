# Log to System.err to avoid file permission and path resolution issues
# Note: SLF4J Simple Logger does not support variable substitution like ${user.home}
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.jitsi.impl.configuration.ConfigurationServiceImpl=off